[project]
name = "tldr-embeddings"
version = "0.1.0"
description = "Chunk TLDR newsletter archives and load them into MongoDB Atlas for vector search"
requires-python = ">=3.10"
dependencies = [
    "pymongo>=4.0.0",
    "python-dotenv>=1.0.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
